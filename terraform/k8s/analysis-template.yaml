apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-health-check
  namespace: default
spec:
  metrics:
    - name: canary-http-health
      interval: 15s
      count: 4
      failureLimit: 1
      successCondition: result[0] == 1
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          # TEMPORARY TEST: forces the analysis to fail.
          # Restore the original probe_success query after the rollback test.
          query: |
            min(
              probe_success{
                instance="http://devops-project-app-canary.default.svc.cluster.local/"
              }
            ) or vector(0)
