apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: devops-project-route
  namespace: default
spec:
  parentRefs:
    - name: devops-project-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: devops-project-app-stable
          port: 80
          weight: 100
        - name: devops-project-app-canary
          port: 80
          weight: 0
