apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-app
  namespace: default
  labels:
    app: devops-project-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project-app
  template:
    metadata:
      labels:
        app: devops-project-app
    spec:
      containers:
        - name: app
          image: 298660929912.dkr.ecr.ap-south-2.amazonaws.com/devops-project-app:e1577f7d8d752d6030df59a5434566b85601470e
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
