alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'hemanthkumarmotukuri@gmail.com'
      smtp_auth_username: 'hemanthkumarmotukuri@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-gmail/smtp-auth-password'
      smtp_require_tls: true

    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info

      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info

      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info

      - target_matchers:
          - alertname = InfoInhibitor

    receivers:
      - name: gmail-alerts
        email_configs:
          - to: 'hemanthkumarmotukuri@gmail.com'
            send_resolved: true

      - name: "null"

    route:
      group_by:
        - namespace
      group_interval: 5m
      group_wait: 30s
      receiver: gmail-alerts
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    templates:
      - /etc/alertmanager/config/*.tmpl

  alertmanagerSpec:
    secrets:
      - alertmanager-gmail