apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-project-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hemanth7040/Argo-Rollback-Project.git
    targetRevision: main
    path: terraform/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
